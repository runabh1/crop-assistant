<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Farming Decision System - Login">
    <title>🌾 Smart Farming - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-primary:#080d16;
            --bg-secondary:#0f1623;
            --bg-card:#151d2e;
            --bg-input:#0b1120;
            --text-primary:#edf2f7;
            --text-secondary:#8899b0;
            --text-muted:#5a6b82;
            --text-accent:#38bdf8;
            --border-color:rgba(100,120,150,.12);
            --accent-1:#22c55e;
            --accent-2:#3b82f6;
            --shadow-md:0 4px 14px rgba(0,0,0,.4);
            --shadow-lg:0 8px 32px rgba(0,0,0,.5);
        }
        [data-theme="light"]{
            --bg-primary:#f0f4f8;
            --bg-secondary:#fff;
            --bg-card:#fff;
            --bg-input:#edf2f7;
            --text-primary:#0f172a;
            --text-secondary:#475569;
            --text-muted:#94a3b8;
            --text-accent:#0284c7;
            --border-color:rgba(0,0,0,.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html {
            font-size: 13.5px;
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .3s, color .3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 15% 15%, rgba(34, 197, 94, .03), transparent 55%),
                        radial-gradient(ellipse at 85% 85%, rgba(59, 130, 246, .03), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(20px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Inter', system-ui, sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--text-accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .demo-credentials {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .demo-credentials strong {
            color: var(--accent-1);
            display: block;
            margin-bottom: 6px;
        }

        .demo-credentials code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-accent);
        }

        .btn-login {
            padding: 12px 24px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-icon {
            font-size: 1.2rem;
        }

        .btn-loader {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .btn-loader {
            display: block;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .login-error.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #86efac;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        .login-success.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s;
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: rotate(30deg);
        }

        .login-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .login-footer strong {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
    </button>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">🌾</div>
                <h1 class="login-title">Smart Farming</h1>
                <p class="login-subtitle">AI Decision System for Marginal Farmers</p>
            </div>

            <div class="login-error" id="loginError"></div>
            <div class="login-success" id="loginSuccess"></div>

            <div class="demo-credentials">
                <strong>📝 Demo Credentials:</strong>
                Email: <code>abc@123</code><br>
                Password: <code>1234</code>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">📧 Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="e.g., abc@123"
                        value="abc@123"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">🔐 Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        value="1234"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-icon">🚀</span>
                    <span class="btn-text">Login to Your Farm</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div class="login-footer">
                <strong>🌾 Smart Farming</strong><br>
                Empowering marginal farmers with AI-driven crop advisory
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon();
        });

        function updateThemeIcon() {
            const theme = html.getAttribute('data-theme');
            document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        // Login Form Handler
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            loginError.classList.remove('show');
            loginSuccess.classList.remove('show');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess(data.message || 'Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please try again.');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        function showError(message) {
            loginError.textContent = '❌ ' + message;
            loginError.classList.add('show');
            loginSuccess.classList.remove('show');
        }

        function showSuccess(message) {
            loginSuccess.textContent = '✅ ' + message;
            loginSuccess.classList.add('show');
            loginError.classList.remove('show');
        }

        // Check if already logged in
        async function checkSession() {
            try {
                const response = await fetch('/api/check-session');
                const data = await response.json();
                
                if (data.logged_in) {
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        }

    </script>
</body>
</html>
