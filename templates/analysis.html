<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comprehensive Crop Analysis - Satellite, Weather, AI Advisory">
    <title>🌾 Smart Farming - Crop Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .app-layout { display: grid; grid-template-columns: 350px 1fr; gap: 0; min-height: calc(100vh - 80px); }
        .input-panel { background: var(--bg-card); border-right: 1px solid var(--border-color); overflow-y: auto; padding: 24px; }
        .output-panel { background: var(--bg-primary); overflow-y: auto; padding: 32px; }
        
        .mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .mode-tab { flex: 1; padding: 12px 8px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; transition: all 0.3s; text-align: center; }
        .mode-tab.active { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; border-color: #1d4ed8; }
        .mode-tab small { display: block; font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }
        
        .sensor-form { display: flex; flex-direction: column; gap: 24px; }
        .input-group { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
        .group-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
        .group-hint { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-field { display: flex; flex-direction: column; gap: 4px; }
        .input-field label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
        .input-wrapper { position: relative; }
        .form-input { width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 0.85rem; }
        .form-input:focus { outline: none; border-color: var(--text-accent); }
        .input-unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 0.7rem; color: var(--text-muted); }
        
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .output-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .output-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
        .card-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .card-value { font-size: 1.8rem; font-weight: 800; color: var(--text-accent); }
        .card-unit { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        
        .section { margin-bottom: 32px; }
        .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border-color); }
        
        .weather-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .weather-item { background: var(--bg-secondary); padding: 12px; border-radius: 6px; text-align: center; }
        .weather-icon { font-size: 2rem; margin-bottom: 4px; }
        .weather-value { font-size: 1.4rem; font-weight: 700; }
        .weather-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        
        .alert-item { background: var(--bg-secondary); border-left: 3px solid #f59e0b; padding: 12px; border-radius: 4px; margin-bottom: 8px; }
        .alert-item.critical { border-left-color: #ef4444; }
        .alert-item.success { border-left-color: #22c55e; }
        .alert-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .alert-message { font-size: 0.85rem; color: var(--text-secondary); }
        
        .chart-container { position: relative; height: 300px; margin-bottom: 16px; background: var(--bg-secondary); padding: 16px; border-radius: 8px; }
        
        .advice-box { background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(29, 78, 216, 0.1) 100%); border-left: 3px solid #3b82f6; padding: 16px; border-radius: 6px; margin-bottom: 16px; }
        .advice-title { font-weight: 700; color: #3b82f6; margin-bottom: 8px; }
        .advice-text { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .tab { padding: 8px 16px; background: none; border: none; cursor: pointer; font-size: 0.9rem; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab.active { color: var(--text-accent); border-bottom-color: var(--text-accent); }
        
        .back-btn { margin-bottom: 16px; padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; color: var(--text-primary); transition: all 0.3s; }
        .back-btn:hover { background: var(--bg-input); }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🌾</span>
                <div class="logo-text">
                    <h1>Smart Farming</h1>
                    <span class="logo-subtitle">Comprehensive Crop Analysis</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle">🌙</button>
            <button class="btn-logout" id="logoutBtn" style="padding: 10px 20px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: #fff; border: none; border-radius: 8px; cursor: pointer;">🚪 Logout</button>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="app-layout">
        <!-- INPUT PANEL -->
        <aside class="input-panel">
            <button class="back-btn" onclick="window.location.href='/dashboard'">← Back to Dashboard</button>
            
            <div class="mode-tabs">
                <button class="mode-tab active" id="tabAuto" data-mode="auto">
                    <span>🛰️</span> Smart Mode
                </button>
                <button class="mode-tab" id="tabManual" data-mode="manual">
                    <span>🌡️</span> Manual Mode
                </button>
            </div>

            <form id="sensorForm" class="sensor-form">
                <!-- AUTO MODE -->
                <div class="mode-section auto-section" id="autoSection">
                    <div class="input-group">
                        <h3 class="group-title">📍 Your Location</h3>
                        <button type="button" class="btn-location" id="getLocationBtn" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                            📍 Detect My Location
                        </button>
                        <div id="locationInfo" style="margin-top: 12px; padding: 8px; background: var(--bg-input); border-radius: 4px; text-align: center; font-size: 0.85rem; color: var(--text-secondary); display: none;">
                            <div id="locBadge">📍 Location detected</div>
                            <div id="locCoords" style="font-size: 0.75rem; margin-top: 4px;"></div>
                        </div>
                    </div>

                    <div class="input-group">
                        <h3 class="group-title">🧪 Soil Data</h3>
                        <div class="input-row">
                            <div class="input-field">
                                <label>Nitrogen (N)</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="autoN" value="60" min="0" max="200">
                                    <span class="input-unit">kg/ha</span>
                                </div>
                            </div>
                            <div class="input-field">
                                <label>Phosphorus (P)</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="autoP" value="40" min="0" max="150">
                                    <span class="input-unit">kg/ha</span>
                                </div>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-field">
                                <label>Potassium (K)</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="autoK" value="40" min="0" max="200">
                                    <span class="input-unit">kg/ha</span>
                                </div>
                            </div>
                            <div class="input-field">
                                <label>Soil pH</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="autoPH" value="6.5" min="0" max="14" step="0.1">
                                    <span class="input-unit">pH</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MANUAL MODE -->
                <div class="mode-section manual-section" id="manualSection" style="display: none;">
                    <div class="input-group">
                        <h3 class="group-title">🌡️ Weather Data</h3>
                        <div class="input-row">
                            <div class="input-field">
                                <label>Temperature</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="manualTemp" value="25" min="-20" max="50">
                                    <span class="input-unit">°C</span>
                                </div>
                            </div>
                            <div class="input-field">
                                <label>Humidity</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="manualHumidity" value="60" min="0" max="100">
                                    <span class="input-unit">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="input-field">
                            <label>Rainfall</label>
                            <div class="input-wrapper">
                                <input type="number" class="form-input" id="manualRainfall" value="100" min="0" max="500">
                                <span class="input-unit">mm</span>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <h3 class="group-title">🧪 Soil Data</h3>
                        <div class="input-row">
                            <div class="input-field">
                                <label>Nitrogen (N)</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="manualN" value="60" min="0" max="200">
                                    <span class="input-unit">kg/ha</span>
                                </div>
                            </div>
                            <div class="input-field">
                                <label>Phosphorus (P)</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="manualP" value="40" min="0" max="150">
                                    <span class="input-unit">kg/ha</span>
                                </div>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-field">
                                <label>Potassium (K)</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="manualK" value="40" min="0" max="200">
                                    <span class="input-unit">kg/ha</span>
                                </div>
                            </div>
                            <div class="input-field">
                                <label>Soil pH</label>
                                <div class="input-wrapper">
                                    <input type="number" class="form-input" id="manualPH" value="6.5" min="0" max="14" step="0.1">
                                    <span class="input-unit">pH</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">🚀 Analyze & Get Advisory</button>
            </form>
        </aside>

        <!-- OUTPUT PANEL -->
        <div class="output-panel">
            <!-- TABS -->
            <div class="tabs" id="resultTabs" style="display: none; flex-wrap: wrap;">
                <button class="tab active" data-tab="analysis">📊 Analysis</button>
                <button class="tab" data-tab="disease">🦠 Disease</button>
                <button class="tab" data-tab="mandi">🏪 Mandi Prices</button>
                <button class="tab" data-tab="news">📰 News</button>
                <button class="tab" data-tab="chatbot">💬 AI Chatbot</button>
                <button class="tab" data-tab="alerts">🚨 SMS Alerts</button>
            </div>

            <!-- CONTENT -->
            <div id="outputContent">
                <p style="text-align: center; color: var(--text-muted); padding: 40px;">
                    👈 Enter your data and click "Analyze & Get Advisory" to see comprehensive analysis
                </p>
            </div>
        </div>
    </div>

    <script>
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        // Mode switching
        document.getElementById('tabAuto').addEventListener('click', () => {
            document.getElementById('autoSection').style.display = 'block';
            document.getElementById('manualSection').style.display = 'none';
            document.getElementById('tabAuto').classList.add('active');
            document.getElementById('tabManual').classList.remove('active');
        });

        document.getElementById('tabManual').addEventListener('click', () => {
            document.getElementById('autoSection').style.display = 'none';
            document.getElementById('manualSection').style.display = 'block';
            document.getElementById('tabAuto').classList.remove('active');
            document.getElementById('tabManual').classList.add('active');
        });

        // Get location
        document.getElementById('getLocationBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        document.getElementById('locationInfo').style.display = 'block';
                        document.getElementById('locCoords').textContent = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
                        document.getElementById('getLocationBtn').textContent = '✅ Location Detected';
                        document.getElementById('getLocationBtn').style.opacity = '0.7';
                        
                        // Fetch weather for this location
                        fetch('/api/weather', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ latitude, longitude })
                        })
                        .then(r => r.json())
                        .then(data => {
                            document.getElementById('autoN').value = data.N || 60;
                            document.getElementById('autoP').value = data.P || 40;
                            document.getElementById('autoK').value = data.K || 40;
                            document.getElementById('autoPH').value = data.pH || 6.5;
                        });
                    },
                    () => alert('❌ Unable to get location. Please use Manual Mode.')
                );
            }
        });

        // Form submission
        document.getElementById('sensorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const mode = document.getElementById('tabAuto').classList.contains('active') ? 'auto' : 'manual';
            const data = {
                mode: mode,
                N: parseFloat(document.getElementById(mode === 'auto' ? 'autoN' : 'manualN').value),
                P: parseFloat(document.getElementById(mode === 'auto' ? 'autoP' : 'manualP').value),
                K: parseFloat(document.getElementById(mode === 'auto' ? 'autoK' : 'manualK').value),
                pH: parseFloat(document.getElementById(mode === 'auto' ? 'autoPH' : 'manualPH').value)
            };

            if (mode === 'manual') {
                data.temperature = parseFloat(document.getElementById('manualTemp').value);
                data.humidity = parseFloat(document.getElementById('manualHumidity').value);
                data.rainfall = parseFloat(document.getElementById('manualRainfall').value);
            }

            try {
                document.querySelector('.btn-submit').disabled = true;
                document.querySelector('.btn-submit').textContent = '🔄 Analyzing...';

                console.log('[FETCH] Sending data:', data);
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                console.log('[FETCH] Response status:', response.status);
                const result = await response.json();
                console.log('[FETCH] Response data:', result);

                if (result.success) {
                    console.log('[SUCCESS] Calling displayResults...');
                    displayResults(result);
                    console.log('[SUCCESS] displayResults completed');
                } else {
                    console.log('[ERROR] API returned error:', result.error);
                    alert('❌ ' + result.error);
                }
            } catch (error) {
                console.log('[CATCH] Error:', error);
                alert('❌ Error: ' + error.message);
            } finally {
                document.querySelector('.btn-submit').disabled = false;
                document.querySelector('.btn-submit').textContent = '🚀 Analyze & Get Advisory';
            }
        });

        function displayResults(data) {
            console.log('[DISPLAY] Received data:', data);
            
            // Extract crop name from the response structure (API returns crop as object with .name property)
            const cropName = data.crop?.name || data.summary?.crop || 'Unknown';
            const yieldValue = data.yield?.value || 0;
            const priceValue = data.price?.value || 0;
            const mspValue = data.price?.msp || 0;
            const profitValue = data.profit?.value || 0;
            const ndviValue = data.ndvi?.ndvi || 0;
            const ndviHealth = data.ndvi?.health || 'Unknown';
            
            // Build HTML with the response data
            let html = `
                <div style="animation: fadeIn 0.5s;">
                    <!-- CROP RECOMMENDATION -->
                    <div class="section">
                        <div class="section-title">🌾 Recommended Crop</div>
                        <div class="output-grid">
                            <div class="output-card">
                                <div class="card-label">Best Crop</div>
                                <div class="card-value">${cropName}</div>
                            </div>
                        </div>
                    </div>

                    <!-- KEY METRICS -->
                    <div class="section">
                        <div class="section-title">📊 Performance Metrics</div>
                        <div class="output-grid">
                            <div class="output-card">
                                <div class="card-label">Expected Yield</div>
                                <div class="card-value">${(yieldValue || 0).toFixed(2)}</div>
                                <div class="card-unit">tons/hectare</div>
                            </div>
                            <div class="output-card">
                                <div class="card-label">Market Price</div>
                                <div class="card-value">₹${Math.round(priceValue || 0)}</div>
                                <div class="card-unit">per quintal</div>
                            </div>
                            <div class="output-card">
                                <div class="card-label">Profit Potential</div>
                                <div class="card-value">₹${((profitValue || 0) / 1000).toFixed(1)}K</div>
                                <div class="card-unit">per hectare</div>
                            </div>
                            <div class="output-card">
                                <div class="card-label">MSP (Min Support)</div>
                                <div class="card-value">₹${Math.round(mspValue || 0)}</div>
                                <div class="card-unit">per quintal</div>
                            </div>
                        </div>
                    </div>

                    <!-- SATELLITE DATA -->
                    <div class="section">
                        <div class="section-title">🛰️ Satellite & Crop Health</div>
                        <div class="output-grid">
                            <div class="output-card">
                                <div class="card-label">NDVI (Crop Health)</div>
                                <div class="card-value">${(ndviValue || 0).toFixed(2)}</div>
                                <div class="card-unit">Health: ${ndviHealth}</div>
                            </div>
                        </div>
                    </div>
            `;
            
            // Add alerts if present
            const alerts = data.alerts;
            if (alerts && (alerts.critical || alerts.warning)) {
                const alertData = alerts.critical || alerts.warning || {};
                html += `
                    <div class="section">
                        <div class="section-title">🚨 Alerts</div>
                        <div class="alert-item critical">
                            <div class="alert-title">${alertData.title || 'Alert'}</div>
                            <div class="alert-message">${alertData.message || 'Unknown alert'}</div>
                        </div>
                    </div>
                `;
            }

            // AI Advisory
            const advisoryData = data.advisory || {};
            const advisories = advisoryData.advisories || [];
            const seasonalTip = advisoryData.seasonal_tip || '';
            const marketInsight = advisoryData.market_insight || '';
            
            html += `
                    <!-- AI ADVISORY -->
                    <div class="section">
                        <div class="section-title">🧠 AI-Powered Advisory</div>
                        <div class="advice-box">
                            <div class="advice-title">Crop Selection Recommendation</div>
                            <div class="advice-text">
                                Based on your soil nutrients, weather conditions, and market analysis, <strong>${cropName}</strong> is the optimal crop choice for maximum yield and profitability.
                            </div>
                        </div>
            `;
            
            if (seasonalTip) {
                html += `
                        <div class="advice-box" style="margin-top: 12px;">
                            <div class="advice-title">🌱 Seasonal Insight</div>
                            <div class="advice-text">${seasonalTip}</div>
                        </div>
                `;
            }
            
            if (marketInsight) {
                html += `
                        <div class="advice-box" style="margin-top: 12px;">
                            <div class="advice-title">💰 Market Insight</div>
                            <div class="advice-text">${marketInsight}</div>
                        </div>
                `;
            }
            
            if (advisories && advisories.length > 0) {
                html += `<div class="advice-box" style="margin-top: 12px;">
                            <div class="advice-title">📋 Additional Recommendations</div>
                            <ul style="margin: 8px 0; padding-left: 20px;">`;
                advisories.slice(0, 5).forEach(adv => {
                    // Handle both string and object recommendations
                    const advText = typeof adv === 'string' ? adv : (adv.text || adv.title || adv.message || '');
                    if (advText) {
                        html += `<li style="margin: 4px 0; color: var(--text-secondary);">${advText}</li>`;
                    }
                });
                html += `</ul></div>`;
            }
            
            html += `
                    </div>
                </div>
            `;

            console.log('[DISPLAY] Setting HTML');
            document.getElementById('outputContent').innerHTML = html;
            console.log('[DISPLAY] HTML set complete');
        }
    </script>
</body>
</html>
