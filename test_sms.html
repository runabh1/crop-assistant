<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 SMS Alert Test - Smart Farming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1f2937 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .test-section {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            font-size: 16px;
            color: #374151;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover {
            background: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30,58,138,0.2);
        }
        button:active {
            transform: translateY(0);
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .button-group button {
            padding: 10px;
            font-size: 13px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .result.success {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            display: block;
        }
        .result.error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            display: block;
        }
        .result.loading {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            color: #1e40af;
            display: block;
        }
        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(30,64,175,0.3);
            border-radius: 50%;
            border-top: 2px solid #1e40af;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 6px;
            color: #1e40af;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 SMS Alert Test System</h1>
        <p class="subtitle">Test Twilio SMS alerts for Smart Farming</p>
        
        <div class="info-box">
            📱 Phone: <strong>+917002168639</strong> | 🌐 API: <strong>http://localhost:5000</strong>
        </div>
        
        <!-- Quick Test Buttons -->
        <div>
            <h2 style="font-size: 14px; margin-bottom: 10px; color: #374151;">⚡ Quick Tests</h2>
            <div class="button-group">
                <button onclick="testDrought()">🌵 Drought Alert</button>
                <button onclick="testHeat()">🔥 Heat Alert</button>
                <button onclick="testFlood()">🌊 Flood Alert</button>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <!-- Custom Test Form -->
        <div class="test-section">
            <h2>🧪 Custom Conditions</h2>
            <form id="customForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Nitrogen (N) [kg/ha]</label>
                        <input type="number" id="n" value="80" min="0" max="200">
                    </div>
                    <div class="form-group">
                        <label>Phosphorus (P) [kg/ha]</label>
                        <input type="number" id="p" value="45" min="0" max="200">
                    </div>
                    <div class="form-group">
                        <label>Potassium (K) [kg/ha]</label>
                        <input type="number" id="k" value="40" min="0" max="200">
                    </div>
                    <div class="form-group">
                        <label>Temperature [°C]</label>
                        <input type="number" id="temperature" value="28" min="-20" max="50">
                    </div>
                    <div class="form-group">
                        <label>Humidity [%]</label>
                        <input type="number" id="humidity" value="70" min="0" max="100">
                    </div>
                    <div class="form-group">
                        <label>Rainfall [mm]</label>
                        <input type="number" id="rainfall" value="100" min="0" max="500">
                    </div>
                    <div class="form-group">
                        <label>Soil pH</label>
                        <input type="number" id="ph" value="6.5" min="4" max="9" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" value="+917002168639">
                    </div>
                </div>
                <button type="button" onclick="sendCustomTest()">📤 Send Test Alert</button>
            </form>
        </div>
        
        <!-- Results -->
        <div id="result" class="result"></div>
    </div>

    <script>
        function sendRequest(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<span class="loading-spinner"></span>Sending SMS alert test...';
            resultDiv.className = 'result loading';
            
            fetch('http://localhost:5000/api/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(resp => resp.json())
            .then(data => {
                let html = '✅ <strong>SMS Alert Test Success!</strong><br><br>';
                html += `<strong>Crop:</strong> ${data.crop}<br>`;
                html += `<strong>Risk Level:</strong> ${data.risk_level} ${data.alert_type === 'critical' ? '🚨' : '✅'}<br>`;
                if (data.alert_type === 'critical') {
                    html += `<strong>Alert Title:</strong> ${data.alert_title}<br>`;
                    html += `<strong>Message:</strong> ${data.alert_msg}<br>`;
                    html += `<strong>Advice:</strong> ${data.advice}<br>`;
                    html += `<br>📱 <strong>SMS sent to +917002168639</strong>`;
                }
                resultDiv.innerHTML = html;
                resultDiv.className = 'result success';
            })
            .catch(err => {
                resultDiv.innerHTML = `❌ Error: ${err.message}`;
                resultDiv.className = 'result error';
            });
        }
        
        function testDrought() {
            sendRequest({
                N: 80, P: 45, K: 40,
                temperature: 28, humidity: 70,
                rainfall: 10,  // DROUGHT
                ph: 6.5,
                phone: "+917002168639"
            });
        }
        
        function testHeat() {
            sendRequest({
                N: 80, P: 45, K: 40,
                temperature: 42,  // HEAT
                humidity: 30,
                rainfall: 150,
                ph: 6.5,
                phone: "+917002168639"
            });
        }
        
        function testFlood() {
            sendRequest({
                N: 80, P: 45, K: 40,
                temperature: 28, humidity: 95,
                rainfall: 250,  // FLOOD
                ph: 6.5,
                phone: "+917002168639"
            });
        }
        
        function sendCustomTest() {
            sendRequest({
                N: parseFloat(document.getElementById('n').value),
                P: parseFloat(document.getElementById('p').value),
                K: parseFloat(document.getElementById('k').value),
                temperature: parseFloat(document.getElementById('temperature').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                rainfall: parseFloat(document.getElementById('rainfall').value),
                ph: parseFloat(document.getElementById('ph').value),
                phone: document.getElementById('phone').value
            });
        }
    </script>
</body>
</html>
